version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: eddy_local
      POSTGRES_DB: eddydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: pgAdmin para visualização
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eddy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eds.local
      PGADMIN_DEFAULT_PASSWORD: eddy_local
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools  # só sobe com: docker-compose --profile tools up

volumes:
  postgres_data:
