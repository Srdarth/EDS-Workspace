version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eddy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eddydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - eddy-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  eddy-net:
    driver: bridge
